<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Dashboard - Heating Melting Ice Lab</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #f0f3f8;
      color: #2c3e50;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1300px;
      margin: auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 25px 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 2px solid #eef2f6;
      padding-bottom: 15px;
      margin-bottom: 20px;
      gap: 15px;
    }
    h1 {
      margin: 0;
      color: #0b5394;
      font-size: 1.7rem;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      background: #e3f2fd;
      color: #0d47a1;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-refresh { background: #007bff; color: #fff; }
    .btn-refresh:hover { background: #0062cc; }
    .btn-export { background: #28a745; color: #fff; }
    .btn-export:hover { background: #218838; }
    .btn-demo { background: #6f42c1; color: #fff; }
    .btn-demo:hover { background: #5a32a3; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f8fafc;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
    }
    .live-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      background-color: #28a745;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* Chart Section */
    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 20px 0 10px 0;
      color: #334155;
    }
    .chart-container {
      position: relative;
      height: 420px;
      width: 100%;
      background: #fafcff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 30px;
    }

    /* Table Section */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #fff;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 980px;
      text-align: center;
    }
    th, td {
      border: 1px solid #e9ecef;
      padding: 8px 6px;
      font-size: 0.88rem;
    }
    th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 700;
    }
    .group-col {
      text-align: left;
      font-weight: 700;
      padding-left: 14px;
      position: sticky;
      left: 0;
      background: #f8fafc;
      z-index: 2;
      border-right: 2px solid #cbd5e1;
    }
    .cell-filled {
      font-weight: 600;
      color: #0b5394;
      background: #f0f7ff;
    }
    .cell-empty {
      color: #cbd5e1;
    }
    .legend-tag {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Heating Melting Ice <span class="badge">Teacher Monitor</span></h1>
      <small style="color: #64748b;">Real-time comparison across all lab stations</small>
    </div>
    <div class="controls">
      <label style="font-size: 0.85rem; font-weight: 600;">
        <input type="checkbox" id="autoRefreshToggle" checked> Auto-refresh (8s)
      </label>
      <button class="btn btn-refresh" onclick="fetchData()">↻ Refresh Now</button>
      <button class="btn btn-export" onclick="exportCombinedCSV()">Export CSV</button>
      <button class="btn btn-demo" onclick="loadMockData()">Demo Data</button>
    </div>
  </header>

  <div class="status-bar">
    <div>
      <span class="live-dot" id="liveDot"></span>
      <span id="syncStatus">Connecting to Google Sheet...</span>
    </div>
    <div id="lastUpdated" style="color: #64748b;">Last updated: Never</div>
  </div>

  <div class="section-title">Multi-Group Temperature Curves</div>
  <div class="chart-container">
    <canvas id="allGroupsChart"></canvas>
  </div>

  <div class="section-title">Master Reading Matrix (0 to 15 min)</div>
  <div class="table-wrapper">
    <table id="groupsTable">
      <thead>
        <tr id="tableHeaderRow">
          <th class="group-col">Group</th>
          <!-- Minutes 0 through 15 -->
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="17" style="padding: 20px; color: #94a3b8;">Connecting to Google Sheet...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // Link to your Google Apps Script Web App
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxQamM5cKoiD6Y5602vuS6VVFj9VVxZYqwLO2wFWSWLfQrQCON7etJYGXEdAZQAWZ1L/exec";

  // Palette of distinct colors for groups
  const PALETTE = [
    '#007bff', '#e63946', '#2a9d8f', '#f4a261', '#9b5de5',
    '#3a86ff', '#fb5607', '#06d6a0', '#118ab2', '#8338ec', '#ff006e'
  ];

  let chart = null;
  let cachedData = {}; // Format: { "Group 1": [null, 0.2, ...], "Group 2": [...] }

  // 1. Build Table Headers (0 - 15)
  const headerRow = document.getElementById('tableHeaderRow');
  for (let min = 0; min <= 15; min++) {
    const th = document.createElement('th');
    th.textContent = `${min} m`;
    headerRow.appendChild(th);
  }

  // 2. Initialize Chart.js
  const ctx = document.getElementById('allGroupsChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: Array.from({ length: 16 }, (_, i) => `${i} min`),
      datasets: []
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label}: ${ctx.raw !== null ? ctx.raw + ' °C' : 'No data'}`
          }
        },
        legend: {
          position: 'top',
          labels: { boxWidth: 14, font: { weight: 'bold' } }
        }
      },
      scales: {
        x: {
          title: { display: true, text: 'Time (minutes)', font: { weight: 'bold' } }
        },
        y: {
          title: { display: true, text: 'Temperature (°C)', font: { weight: 'bold' } },
          suggestedMin: -5,
          suggestedMax: 100
        }
      }
    }
  });

  // 3. Fetch Data from Apps Script
  async function fetchData() {
    const statusBox = document.getElementById('syncStatus');
    statusBox.textContent = "Fetching latest submissions...";
    try {
      const response = await fetch(`${GOOGLE_SCRIPT_URL}?ts=${Date.now()}`);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const records = await response.json();
      processSubmissions(records);
      document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
      
      const groupCount = Object.keys(cachedData).length;
      statusBox.textContent = groupCount > 0 
        ? `Live: Connected to Sheet (${groupCount} active groups).`
        : "Connected to Sheet. Waiting for student submissions...";
    } catch (err) {
      console.warn("Fetch error:", err);
      statusBox.textContent = "⚠️ Could not connect to Google Sheet. Check web app deployment.";
    }
  }

  // 4. Process incoming rows: [{group, minute, temperature, timestamp}, ...]
  function processSubmissions(records) {
    if (!Array.isArray(records)) return;

    const groups = {};
    records.forEach(row => {
      const grp = (row.group || 'Unknown').trim();
      const min = parseInt(row.minute, 10);
      const temp = parseFloat(row.temperature);

      if (!groups[grp]) {
        groups[grp] = Array(16).fill(null);
      }
      if (!isNaN(min) && min >= 0 && min <= 15 && !isNaN(temp)) {
        groups[grp][min] = temp;
      }
    });

    cachedData = groups;
    renderUI();
  }

  // 5. Update Graph & Table
  function renderUI() {
    const groupNames = Object.keys(cachedData).sort();
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    if (groupNames.length === 0) {
      tbody.innerHTML = `<tr><td colspan="17" style="padding: 20px; color: #94a3b8;">No data records found in Google Sheet yet.</td></tr>`;
      chart.data.datasets = [];
      chart.update();
      return;
    }

    const datasets = [];

    groupNames.forEach((grp, idx) => {
      const color = PALETTE[idx % PALETTE.length];
      const readings = cachedData[grp];

      // Add line to Chart
      datasets.push({
        label: grp,
        data: readings,
        borderColor: color,
        backgroundColor: color,
        tension: 0.25,
        fill: false,
        pointRadius: 4,
        pointHoverRadius: 6,
        spanGaps: true
      });

      // Add row to Table
      const tr = document.createElement('tr');
      const tdName = document.createElement('td');
      tdName.className = 'group-col';
      tdName.innerHTML = `<span class="legend-tag" style="background:${color};"></span>${grp}`;
      tr.appendChild(tdName);

      for (let m = 0; m <= 15; m++) {
        const td = document.createElement('td');
        const val = readings[m];
        if (val !== null && val !== undefined) {
          td.textContent = Number(val).toFixed(1);
          td.className = 'cell-filled';
        } else {
          td.textContent = '—';
          td.className = 'cell-empty';
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    });

    chart.data.datasets = datasets;
    chart.update();
  }

  // 6. Demo Mock Data Generator for offline practice
  function loadMockData() {
    const mock = [
      { group: "Group 1", minute: 0, temperature: -2.0 },
      { group: "Group 1", minute: 1, temperature: 0.0 },
      { group: "Group 1", minute: 2, temperature: 0.0 },
      { group: "Group 1", minute: 3, temperature: 0.5 },
      { group: "Group 1", minute: 4, temperature: 3.5 },
      { group: "Group 1", minute: 5, temperature: 9.0 },
      { group: "Group 1", minute: 6, temperature: 18.0 },
      { group: "Group 2", minute: 0, temperature: -4.5 },
      { group: "Group 2", minute: 1, temperature: -2.0 },
      { group: "Group 2", minute: 2, temperature: -1.0 },
      { group: "Group 2", minute: 3, temperature: 0.0 },
      { group: "Group 2", minute: 4, temperature: 1.5 },
      { group: "Group 2", minute: 5, temperature: 5.0 },
      { group: "Group 3", minute: 0, temperature: -1.0 },
      { group: "Group 3", minute: 1, temperature: 0.2 },
      { group: "Group 3", minute: 2, temperature: 2.0 },
      { group: "Group 3", minute: 3, temperature: 7.0 },
      { group: "Group 3", minute: 4, temperature: 14.5 }
    ];
    processSubmissions(mock);
    document.getElementById('syncStatus').textContent = "Loaded simulated mock data.";
    document.getElementById('lastUpdated').textContent = `Last updated: ${new Date().toLocaleTimeString()}`;
  }

  // 7. Export All Groups to Master CSV
  function exportCombinedCSV() {
    const groups = Object.keys(cachedData);
    if (groups.length === 0) {
      alert("No data available to export.");
      return;
    }

    let csv = "Group,Time (min),Temperature (°C)\n";
    groups.forEach(grp => {
      cachedData[grp].forEach((temp, min) => {
        if (temp !== null) {
          csv += `"${grp}",${min},${temp}\n`;
        }
      });
    });

    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `All_Groups_Ice_Melting_Data_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  // 8. Auto-Refresh Interval (8 seconds)
  setInterval(() => {
    if (document.getElementById('autoRefreshToggle').checked) {
      fetchData();
    }
  }, 8000);

  // Initial fetch on page load
  fetchData();
</script>
</body>
</html>
